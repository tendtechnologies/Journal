<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Journal</title>
  <meta name="description" content="Journal is a quiet, private place to write one entry a day — mood, photos, and a streak to keep you coming back, synced across your devices." />

  <meta property="og:title" content="Journal" />
  <meta property="og:description" content="A quiet place to write. One entry a day, synced across your devices." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/icon-512.png" />
  <meta name="twitter:card" content="summary" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.firebasestorage.app https://firebasestorage.googleapis.com; connect-src 'self' https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebasestorage.googleapis.com wss://*.firebaseio.com; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" />

  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="shortcut icon" href="assets/icon-192.png" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Journal" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=12" />
</head>
<body>

  <!-- Auth gate -->
  <div id="auth-gate">
    <div class="gate-card">
      <img src="assets/icon-192.png" width="56" height="56" class="gate-icon" alt="" />
      <h1 class="gate-title">Journal</h1>
      <p class="gate-sub">A quiet place to write. Your entries stay private and sync across your devices.</p>
      <button id="google-signin-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36.5 24 36.5c-5.2 0-9.6-3.4-11.2-8.1l-6.5 5C9.7 39.8 16.4 44 24 44z"/><path fill="#1565C0" d="M43.6 20H24v8h11.3c-.8 2.4-2.4 4.4-4.5 5.8l6.2 5.2C40.8 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
        Continue with Google
      </button>
      <div id="signin-error" class="gate-error"></div>
    </div>
  </div>

  <!-- PIN gate -->
  <div id="pin-gate">
    <div class="gate-card">
      <img src="assets/icon-192.png" width="56" height="56" class="gate-icon" alt="" />
      <h1 class="gate-title" id="pin-title">Enter PIN</h1>
      <p class="gate-sub" id="pin-sub">Unlock your journal</p>
      <div class="pin-dots" id="pin-dots"></div>
      <span class="sr-only" id="pin-progress" aria-live="polite" role="status"></span>
      <div class="pin-pad" id="pin-pad">
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" class="pin-key-alt" id="pin-cancel">Cancel</button>
        <button type="button" data-k="0">0</button>
        <button type="button" id="pin-back" aria-label="Backspace">
          <svg viewBox="0 0 24 24" class="ic"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>
        </button>
      </div>
      <div id="pin-error" class="gate-error"></div>
      <button class="btn-primary" id="pin-continue" style="display:none;margin-top:6px">Continue</button>
      <button class="link-btn" id="pin-forgot" style="display:none">Forgot PIN?</button>
    </div>
  </div>

  <div id="boot"><div class="boot-spinner"></div></div>

  <!-- App -->
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/icon-192.png" width="26" height="26" alt="" />
        <span>Journal</span>
      </div>

      <div class="tabs-wrap">
        <nav class="tabs" id="tabs">
          <button class="tab active" data-view="write">Write</button>
          <button class="tab" data-view="entries">Entries</button>
          <button class="tab" data-view="calendar">Calendar</button>
          <button class="tab" data-view="insights">Insights</button>
        </nav>
      </div>

      <div class="topbar-right">
        <div class="streak-chip" id="streak-chip" title="Current streak">
          <svg viewBox="0 0 24 24" class="ic flame"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.5.5-2.6 1-3.5C8.5 9 9 11 10.5 11 12 11 12 8 12 2z"/></svg>
          <span id="streak-count">0</span>
        </div>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" class="ic" id="theme-icon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="avatar-btn" id="avatar-btn" aria-label="Settings"><span id="avatar-inner">?</span></button>
      </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="bn-item active" data-view="write">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Write</span>
      </button>
      <button class="bn-item" data-view="entries">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Entries</span>
      </button>
      <button class="bn-item" data-view="calendar">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendar</span>
      </button>
      <button class="bn-item" data-view="insights">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>Insights</span>
      </button>
    </nav>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt="" /></div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-head">
        <h2 id="modal-title">Title</h2>
        <button class="icon-btn" id="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Recovery banner: shown only if the app fails to start -->
  <div id="recover">
    <div class="recover-card">
      <h2>Something didn't load right</h2>
      <p>This is usually an old cached version of the app. Clearing it should fix things — your entries aren't affected.</p>
      <button id="recover-btn">Clear cache and reload</button>
      <div id="recover-detail"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="js/core.js?v=12"></script>
  <script src="js/app.js?v=12"></script>

  <script src="js/boot.js?v=12"></script>
</body>
</html>
