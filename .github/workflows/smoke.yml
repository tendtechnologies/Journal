name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fail the build if ?v= cache-bust strings drifted out of lockstep
      # between index.html and sw.js (run scripts/bump-version.mjs to fix).
      - run: node scripts/check-version.mjs
      # Unit tests for the pure sync/merge/tombstone/streak logic in js/core.js.
      - run: npm run test:unit
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The google-services plugin is conditional, so a checkout without
      # google-services.json still configures and builds fine.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
        working-directory: android
